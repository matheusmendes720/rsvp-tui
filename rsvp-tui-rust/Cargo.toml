[package]
name = "rsvp-tui-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
rsvp-core = { path = "../rsvp-core" }
ratatui = "0.26"
crossterm = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
